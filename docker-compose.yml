services:
  postgres:
    image: postgres:17-alpine
    container_name: habit-ledger-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: habit_ledger
    volumes:
      - habit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  habit_pg_data:
